<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>LIVE! 한국 인디 디깅</title>
<meta name="description" content="한국 인디음악의 팬, 아티스트, 호스트가 만나는 곳. 아티스트를 디깅하고 공연을 찾고, 팬이 되어 보세요.">
<meta property="og:title" content="LIVE! 한국 인디 디깅">
<meta property="og:description" content="한국 인디음악의 팬, 아티스트, 호스트가 만나는 곳.">
<meta property="og:url" content="https://livearts.net">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23E5202E'/%3E%3Ctext x='34' y='47' font-size='42' font-family='Arial Black,sans-serif' font-style='italic' font-weight='900' text-anchor='middle' fill='%23fff'%3E!%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:ital,wght@1,700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0B0C; --surface:#141416; --surface-2:#1D1D20; --surface-3:#26262A; --line:#2C2C31;
  --ink:#F3F2EF; --ink-2:#B7B6B0; --ink-3:#7E7D78;
  --red:#E5202E; --red-hover:#F23441; --red-soft:#3A1216; --on-red:#FFFFFF;
  --sticker:#F2D23B; --sticker-ink:#191500; --ok:#5ACB8C; --err:#FF7A7A;
  --logo:"Chakra Petch","Arial Black",Impact,sans-serif;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 72px}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:18px 16px;border-bottom:1px solid var(--line)}
.logo{display:inline-block;background:var(--red);color:var(--on-red);font-family:var(--logo);font-style:italic;font-weight:700;font-size:28px;line-height:1;letter-spacing:.02em;padding:7px 14px 6px 11px;border-radius:2px;text-decoration:none}
.logo:hover{background:var(--red-hover)}
.nav{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink-2);padding:7px 12px;border-radius:4px;font-size:14.5px;font-weight:500}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:10px;font-size:14px}
.acct a{text-decoration:none}
.badge-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:4px}

/* type */
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1.15}
h2{font-size:24px;line-height:1.2}
h3{margin:0}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:14px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
section.block{margin-top:40px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sechead a{font-size:13.5px;color:var(--ink-2)}

/* banner + toast */
.banner{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--surface)}
.banner.ok{border-color:var(--ok);color:var(--ok)} .banner.err{border-color:var(--err);color:var(--err)}
.banner a{color:inherit}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-3);color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.err{border-color:var(--err);color:var(--err)}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-hover);border-color:var(--red-hover)}
.btn.big{padding:11px 22px;font-size:15px}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:13.5px}
label{display:grid;gap:6px;font-size:13.5px;font-weight:500}
label small,.lbl small{font-weight:400;color:var(--ink-3)}
.lbl{font-size:13.5px;font-weight:500;margin-bottom:8px}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 11px;font-size:15px;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--ink-3);outline:none}
textarea{resize:vertical;min-height:110px;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 28px;display:grid;gap:14px;min-width:0}
legend{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);padding:0 0 10px;border-bottom:1px solid var(--line);width:100%;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--red)}
.status{font-size:13.5px;color:var(--ink-2);margin:0}
.status:empty{display:none}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}

/* hero search */
.hero{padding-block:44px 8px;display:grid;gap:18px;max-width:720px}
.hero h1{font-size:clamp(30px,5vw,46px)}
.hero h1 em{font-style:normal;color:var(--red)}
.search{display:flex;gap:8px}
.search input{flex:1}

/* page card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pcard:hover{border-color:var(--ink-3)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--surface-3)}
.sticker{position:absolute;top:10px;right:10px;background:var(--sticker);color:var(--sticker-ink);font-weight:700;font-size:12px;padding:4px 9px;border-radius:2px;transform:rotate(3deg)}
.kindtag{position:absolute;left:10px;top:10px;background:rgba(11,11,12,.8);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:2px}
.pcard .b{padding:14px 14px 16px;display:grid;gap:8px}
.pcard .nm{font-family:var(--display);font-size:22px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:3px 10px}
.gtags{display:flex;flex-wrap:wrap;gap:5px}
.gtag{background:var(--surface-3);color:var(--ink);font-size:12px;padding:2px 8px;border-radius:999px}
.one{font-size:14px;margin:0;color:var(--ink)}

/* event stubs */
.stubs{display:grid;gap:8px}
.stub{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
@media (max-width:560px){.stub{grid-template-columns:auto 1fr}.stub .act{grid-column:1/-1;justify-self:start}}
.stub .d{font-family:var(--mono);text-align:center;border-right:1px dashed var(--line);padding-right:16px;min-width:64px;font-variant-numeric:tabular-nums}
.stub .d .m{font-size:11.5px;color:var(--red);font-weight:500;letter-spacing:.06em}
.stub .d .dd{font-size:26px;line-height:1.1;font-weight:500}
.stub .d .w{font-size:11.5px;color:var(--ink-3)}
.stub .t{font-weight:700;font-size:15px}
.stub .v{font-size:13px;color:var(--ink-2)}
.stub .v a{color:var(--ink-2)}
.stub.past{opacity:.6}
.empty{padding:36px 16px;color:var(--ink-2);text-align:center;border:1px dashed var(--line);border-radius:6px;display:grid;gap:12px;justify-items:center}

/* filters */
.filters{display:grid;gap:12px;margin:20px 0}
.filters .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.filters input[type=search]{max-width:320px}

/* profile page */
.prof{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:32px;margin-top:28px;align-items:start}
@media (max-width:820px){.prof{grid-template-columns:1fr}}
.prof .ph{border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.prof h1{font-size:clamp(32px,5vw,48px);word-break:keep-all;overflow-wrap:anywhere}
.prof .head{display:grid;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fans{font-size:13.5px;color:var(--ink-2)}
.fans b{color:var(--ink);font-family:var(--mono)}
.sect{border-top:1px solid var(--line);padding-top:18px;margin-top:24px}
.sect h3{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.bio{white-space:pre-line;color:var(--ink-2);margin:0;max-width:65ch}
.tracks{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.tracks li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.tracks li span{font-family:var(--mono);color:var(--ink-3);font-size:13px;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 11px;border-radius:4px}
.links a:hover{border-color:var(--red);color:var(--ink)}
.contact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact code{font-family:var(--mono);background:var(--surface-2);padding:3px 8px;border-radius:4px;user-select:all;overflow-wrap:anywhere}
.members{display:flex;flex-wrap:wrap;gap:8px}
.member{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:13.5px}
.role{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:2px;background:var(--red);color:#fff}
.role.member{background:var(--surface-3);color:var(--ink-2)}
.soon{border:1px dashed var(--line);border-radius:6px;padding:16px;color:var(--ink-3);font-size:13.5px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;margin-top:28px;align-items:start}
@media (max-width:880px){.editor{grid-template-columns:1fr}}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:20px}
@media (max-width:880px){.side{position:static}}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.guide .bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:10px 0 14px}
.guide .bar i{display:block;height:100%;background:var(--red)}
.guide ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.guide li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13.5px}
.guide li .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:11px;margin-top:2px}
.guide li.done .ck{background:var(--ok);border-color:var(--ok);color:#06210f}
.guide li.done .tt{color:var(--ink-3);text-decoration:line-through}
.guide li .tip{display:block;color:var(--ink-3);font-size:12.5px}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo .thumb{width:72px;height:72px;border-radius:4px;background:var(--surface-2);object-fit:cover;border:1px solid var(--line)}
.list{display:grid;gap:8px}
.track{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.track .n{font-family:var(--mono);color:var(--ink-3);font-size:13px;text-align:right}
.x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--err)}
.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.danger-zone{margin-top:40px;border:1px solid #4a1d20;border-radius:6px;padding:16px;display:grid;gap:10px}

/* panels (me / team / auth) */
.narrow{max-width:720px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:14px}
.rows{display:grid;gap:0}
.rowi{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.rowi .who a{text-decoration:none;font-weight:500}
.auth{max-width:420px;margin:40px auto 0}
.switcher{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.switcher button{flex:1;border:0;background:transparent;padding:8px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-2)}
.switcher button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;font-size:14px}
.steps li::before{content:counter(s);font-family:var(--logo);font-style:italic;font-weight:700;font-size:20px;color:var(--red)}
.steps li b{display:block}
.steps li span{color:var(--ink-2);font-size:13.5px}

/* community */
.composer{display:grid;gap:8px}
.composer textarea{min-height:90px}
.posts{display:grid;gap:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px}
.post.pinned{border-color:#5a2226}
.post .ph2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.post .ph2 b{color:var(--ink);font-size:14px}
.post .body{white-space:pre-line;margin:0;max-width:70ch;overflow-wrap:anywhere}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:var(--surface-3);color:var(--ink-2)}
.tag.red{background:var(--red);color:#fff}
.tag.fan{background:var(--sticker);color:var(--sticker-ink)}
.tag.team{background:var(--ink);color:var(--bg)}
.cmts{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:10px}
.cmt{display:grid;gap:2px;font-size:14px}
.cmt .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.cmt .h b{color:var(--ink);font-size:13.5px;font-weight:500}
.cmt p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.cform{display:flex;gap:8px}
.cform input{flex:1}
/* DM */
.threads{display:grid}
.thr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.thr:hover{background:var(--surface)}
.av{width:44px;height:44px;border-radius:4px;background:var(--surface-3);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink-2);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.thr .nm{font-weight:700}
.thr .last{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.thr .tm{font-size:12px;color:var(--ink-3);text-align:right;display:grid;gap:4px;justify-items:end}
.chat{display:grid;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:320px;max-height:60vh;overflow-y:auto;align-content:start}
.msg{max-width:min(78%,520px);display:grid;gap:3px}
.msg .bub{padding:9px 12px;border-radius:10px;background:var(--surface-3);white-space:pre-line;overflow-wrap:anywhere;font-size:14.5px}
.msg.mine{justify-self:end}
.msg.mine .bub{background:var(--red);color:#fff}
.msg .meta2{font-size:11.5px;color:var(--ink-3)}
.msg.mine .meta2{text-align:right}
.dmday{justify-self:center;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.dmform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.dmform textarea{min-height:52px;height:52px}
.pickmenu{display:grid;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px}
.pickmenu a{text-decoration:none;padding:6px 10px;border-radius:4px;font-size:14px}
.pickmenu a:hover{background:var(--surface-3)}
footer{margin-top:64px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--ink-3)}
.loading{padding:48px 0;color:var(--ink-3);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="left">
      <a class="logo" href="#/" aria-label="LIVE! 홈">LIVE!</a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="home">홈</a>
        <a href="#/artists" data-nav="artists">아티스트</a>
        <a href="#/events" data-nav="events">공연</a>
        <a href="#/hosts" data-nav="hosts">호스트</a>
      </nav>
    </div>
    <div class="acct" id="acct"></div>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <main id="app"><div class="loading">불러오는 중…</div></main>
  <footer><span>© LIVE! · livearts.net</span><span>한국 인디의 팬 · 아티스트 · 호스트가 만나는 곳</span></footer>
</div>
<div id="toast" role="status" hidden></div>

<script>

const $ = id => document.getElementById(id);
function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k != null && k !== false) e.append(k); }
  return e;
}
function safeUrl(u){ try{ const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; }catch{ return null; } }
function safePhoto(u){ return (typeof u === "string" && (u.startsWith("blob:") || PHOTO_PREFIXES.some(p => u.startsWith(p)))) ? u : ""; }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function dparts(s){ const d = new Date(s + "T00:00:00"); return { y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(), w:DOW[d.getDay()] }; }
function errMsg(e){
  const m = (e && (e.message || e.error_description)) || "";
  const k = m.match(/LIVE:(\w+)/); if (k && ERR[k[1]]) return ERR[k[1]];
  if (e && e.code === "23505") return "이미 사용 중이에요. 다른 값으로 정해 주세요.";
  if (e && e.code === "23514") return "입력한 내용 중 길이나 형식이 맞지 않는 항목이 있어요.";
  if (/failed to fetch|network/i.test(m)) return "인터넷 연결을 확인해 주세요.";
  if (/jwt|not authenticated/i.test(m)) return "로그인이 만료됐어요. 다시 로그인해 주세요.";
  return "문제가 생겼어요. 잠시 후 다시 시도해 주세요.";
}
function authErr(e){
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "이메일 또는 비밀번호가 맞지 않아요.";
  if (m.includes("email not confirmed")) return "아직 이메일 인증이 안 됐어요. 메일함에서 인증 링크를 눌러주세요.";
  if (m.includes("already registered") || m.includes("already been registered")) return "이미 가입된 이메일이에요. 로그인해 주세요.";
  if (m.includes("rate limit") || m.includes("too many") || e?.status === 429) return "요청이 너무 많아요. 몇 분 뒤에 다시 시도해 주세요.";
  if (m.includes("password") && m.includes("least")) return "비밀번호는 8자 이상으로 정해 주세요.";
  if (m.includes("valid email") || m.includes("invalid email")) return "이메일 주소를 다시 확인해 주세요.";
  return errMsg(e);
}
let toastT;
function toast(t, kind){ const x = $("toast"); x.textContent = t; x.className = kind || ""; x.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => x.hidden = true, 3200); }
function banner(t, kind){ const b = $("banner"); if (!t){ b.hidden = true; return; } b.textContent = t; b.className = "banner " + (kind || ""); b.hidden = false; }
function setStatus(node, t, kind){ node.textContent = t || ""; node.className = "status " + (kind || ""); }
// 두 번 눌러야 실행되는 버튼 (실수 방지)
function confirmBtn(label, cls, onConfirm, again = "한 번 더 누르면 실행돼요"){
  let armed = false, t;
  const b = el("button", { type:"button", class:"btn " + (cls || ""), text:label });
  b.addEventListener("click", async () => {
    if (!armed){ armed = true; b.textContent = again; t = setTimeout(() => { armed = false; b.textContent = label; }, 4000); return; }
    clearTimeout(t); armed = false; b.disabled = true;
    try{ await onConfirm(); } finally { b.disabled = false; b.textContent = label; }
  });
  return b;
}
async function rpc(name, args){ const { error } = await sb.rpc(name, args); if (error) throw error; }

function go(h){ if (location.hash === h) route(); else location.hash = h; }
function route(){
  const h = location.hash || "#/";
  if (/access_token|error_description|type=recovery/.test(h)) return;
  viewId++;
  let navKey = null, fn = null, args = [];
  for (const [re, f, nk] of ROUTES){ const m = h.match(re); if (m){ fn = f; args = m.slice(1); navKey = nk || null; break; } }
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.nav === navKey) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
  if (!fn){ mount(el("div", { class:"empty", style:"margin-top:40px" }, el("div", { text:"페이지를 찾을 수 없어요." }), el("a", { class:"btn", href:"#/", text:"홈으로" }))); return; }
  fn(...args);
}
function mount(...nodes){ $("app").replaceChildren(...nodes); }
function loading(){ mount(el("div", { class:"loading", text:"불러오는 중…" })); return viewId; }
function stale(id){ return id !== viewId; }

  if (ev.lineup) info.append(el("div", { class:"v", text:"라인업 · " + ev.lineup }));

  if (canEdit) act.append(el("a", { class:"btn small ghost", href:`#/e/${ev.id}/edit`, text:"수정" }));
  return el("div", { class:"stub" + (past ? " past" : "") },

/* =================== 아티스트 / 호스트 목록 =================== */
async function viewList(kind){
  const id = loading();
  const { data, error } = await sb.from("pages").select("*").eq("kind", kind).order("updated_at", { ascending:false }).limit(500);
  if (stale(id)) return;
  if (error){ mount(emptyBox("목록을 불러오지 못했어요. 새로고침해 주세요.")); return; }
  const all = data || [];
  const st = { q:(kind === "artist" ? S.q : "") || "", genre:"전체", city:"전체", sub:"전체", booking:false };
  S.q = "";
  const grid = el("div", { class:"grid" });
  const count = el("p", { class:"sub" });
  const q = el("input", { type:"search", id:"list-q", placeholder:"이름, 소개, 장르로 검색", value:st.q, "aria-label":"검색" });
  q.addEventListener("input", () => { st.q = q.value.trim(); draw(); });
  const city = el("select", { id:"list-city", "aria-label":"지역" }, ["전체", ...CITIES].map(c => el("option", { value:c, text:c === "전체" ? "모든 지역" : c })));
  city.addEventListener("change", () => { st.city = city.value; draw(); });
  const sub = el("select", { id:"list-sub", "aria-label":"유형" }, ["전체", ...KIND[kind].subtypes].map(c => el("option", { value:c, text:c === "전체" ? "모든 유형" : c })));
  sub.addEventListener("change", () => { st.sub = sub.value; draw(); });
  const bk = el("button", { type:"button", class:"chip", "aria-pressed":"false", text:KIND[kind].sticker });
  bk.addEventListener("click", () => { st.booking = !st.booking; bk.setAttribute("aria-pressed", String(st.booking)); draw(); });
  const used = {}; all.forEach(p => (p.genres || []).forEach(g => used[g] = (used[g] || 0) + 1));
  const gchips = el("div", { class:"chips" });
  function drawGenres(){
    gchips.textContent = "";
    ["전체", ...Object.keys(used).sort((a, b) => used[b] - used[a])].forEach(g => {
      gchips.append(el("button", { type:"button", class:"chip", "aria-pressed":String(st.genre === g), text:g, onclick:() => { st.genre = g; drawGenres(); draw(); } }));
    });
  }
  function draw(){
    const ql = st.q.toLowerCase();
    const list = all.filter(p =>
      (st.genre === "전체" || (p.genres || []).includes(st.genre)) &&
      (st.city === "전체" || p.city === st.city) &&
      (st.sub === "전체" || p.subtype === st.sub) &&
      (!st.booking || p.booking) &&
      (!ql || [p.name, p.one_liner, p.bio, ...(p.genres || [])].filter(Boolean).join(" ").toLowerCase().includes(ql)));
    count.textContent = `${KIND[kind].label} ${all.length}팀 중 ${list.length}팀`;
    grid.textContent = "";
    if (!list.length) grid.append(emptyBox(all.length ? "조건에 맞는 팀이 없어요. 필터를 바꿔 보세요." : `아직 등록된 ${KIND[kind].label}가 없어요.`, el("a", { class:"btn primary", href:`#/new/${kind}`, text:`${KIND[kind].label} 프로필 만들기` })));
    else list.forEach(p => grid.append(pageCard(p)));
  }
  drawGenres(); draw();

    sub.textContent = { login:"아티스트 디깅은 로그인 없이도 할 수 있어요. 팬 맺기와 프로필 만들기는 로그인이 필요해요.", signup:"가입하면 팬으로 시작해요. 원할 때 아티스트나 호스트 프로필을 만들 수 있어요.", forgot:"가입한 이메일로 재설정 링크를 보내드려요.", reset:"앞으로 로그인할 때 쓸 비밀번호를 입력해 주세요." }[m];
    btn.textContent = { login:"로그인", signup:"가입하기", forgot:"재설정 메일 보내기", reset:"비밀번호 변경" }[m];
    emWrap.hidden = m === "reset"; pwWrap.hidden = m === "forgot"; forgot.hidden = m !== "login";
    pw.autocomplete = m === "login" ? "current-password" : "new-password";
  }
  const form = el("form", { class:"panel", novalidate:true, onsubmit:async e => {
    e.preventDefault();
    const em = email.value.trim(), p = pw.value;
    if (mode !== "reset" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return setStatus(st, "이메일 주소를 다시 확인해 주세요.", "err");
    if (mode !== "forgot" && p.length < 8) return setStatus(st, "비밀번호는 8자 이상이에요.", "err");
    btn.disabled = true; setStatus(st, "처리하는 중…");
    const redirect = location.origin + "/?next=me";
    try{
      let r;
      if (mode === "login") r = await sb.auth.signInWithPassword({ email:em, password:p });

      else if (mode === "forgot") setStatus(st, "재설정 메일을 보냈어요. 메일의 링크를 눌러 새 비밀번호를 정해 주세요.", "ok");

    }catch(err){ setStatus(st, authErr(err), "err"); }
    finally{ btn.disabled = false; }
  } }, sw, emWrap, pwWrap, btn, st, el("div", {}, forgot));
  setMode(mode);
  mount(el("div", { class:"auth" }, el("div", { style:"margin-bottom:16px" }, title, sub), form));

/* =================== 시간 표시 =================== */
function ago(ts){
  const d = new Date(ts), s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "일 전";
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}
function hm(ts){ const d = new Date(ts); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

      } }, ci, cb));
    } else cbox.append(el("a", { href:"#/login", class:"linkbtn", style:"font-size:13px", text:"로그인하고 댓글 달기", onclick:() => { S.next = location.hash; } }));
    return el("article", { class:"post" + (po.pinned ? " pinned" : "") }, head, el("p", { class:"body", text:po.body }), acts.childNodes.length ? acts : null, cbox);
  }
  load();
  return sect;
}

/* =================== DM =================== */
function avatar(name, photo){ const a = el("div", { class:"av" }); const u = safePhoto(photo); if (u) a.append(el("img", { src:u, alt:"" })); else a.textContent = (name || "?").slice(0, 1); return a; }

async function viewDmInbox(){
  if (needLogin()) return;
  const id = loading();
  await refreshMe(); renderAcct();
  if (stale(id)) return;
  if (!S.myPages.length){ mount(el("div", { class:"narrow", style:"margin-top:32px;display:grid;gap:16px" }, el("h1", { text:"DM" }),
    emptyBox("DM은 아티스트·호스트 프로필끼리 주고받을 수 있어요. 먼저 프로필을 만들거나 팀에 참여해 주세요.", el("div", { class:"actions" }, el("a", { class:"btn primary", href:"#/new/artist", text:"아티스트 프로필 만들기" }), el("a", { class:"btn", href:"#/new/host", text:"호스트 프로필 만들기" }))))); return; }
  const results = await Promise.all(S.myPages.map(p => sb.rpc("dm_threads", { p_page:p.id })));
  if (stale(id)) return;
  const blocks = S.myPages.map((p, i) => {
    const th = results[i].data || [];
    return el("div", { class:"panel" },
      el("div", { class:"sechead", style:"margin:0" }, el("h2", { text:p.name }), el("span", { class:"muted", style:"font-size:13px", text:`${KIND[p.kind].label} · 팀원 모두가 함께 보는 DM함` })),
      th.length ? el("div", { class:"threads" }, th.map(t => el("a", { class:"thr", href:`#/dm/${p.id}/${t.peer_id}` },
        avatar(t.peer_name, t.peer_photo),
        el("div", { style:"min-width:0" }, el("div", { class:"nm", text:t.peer_name }), el("div", { class:"last", text:(t.last_from === p.id ? "나: " : "") + t.last_body })),
        el("div", { class:"tm" }, el("span", { text:ago(t.last_at) }), t.unread ? el("span", { class:"badge-dot", text:String(t.unread) }) : null))))
      : el("p", { class:"muted", style:"margin:0", text:p.kind === "artist" ? "아직 대화가 없어요. 호스트 프로필에서 'DM 보내기'로 먼저 인사해 보세요." : "아직 대화가 없어요. 섭외하고 싶은 아티스트 프로필에서 'DM 보내기'를 눌러 보세요." }));
  });
  mount(el("div", { class:"narrow", style:"margin-top:32px;display:grid;gap:20px" },
    el("div", {}, el("div", { class:"eyebrow", text:"아티스트 · 호스트 메시지" }), el("h1", { text:"DM" }), el("p", { class:"sub", text:"섭외, 공연 협의, 협업 이야기를 프로필끼리 나눠요. 같은 팀의 팀원은 모두 같은 대화를 보고 답할 수 있어요." })),
    blocks));
}

async function viewDmThread(mine, peer){
  if (needLogin()) return;
  const id = loading();
  if (!S.roles.has(mine)){ mount(emptyBox("이 팀의 팀원만 볼 수 있는 대화예요.", el("a", { class:"btn", href:"#/dm", text:"DM함으로" }))); return; }
  const [a, b] = await Promise.all([
    sb.from("pages").select("id,name,kind,photo_url").eq("id", mine).maybeSingle(),
    sb.from("pages").select("id,name,kind,photo_url").eq("id", peer).maybeSingle()
  ]);
  if (stale(id)) return;
  const me = a.data, other = b.data;
  if (!me || !other || mine === peer){ mount(emptyBox("대화 상대를 찾을 수 없어요.", el("a", { class:"btn", href:"#/dm", text:"DM함으로" }))); return; }

  const chat = el("div", { class:"chat", "aria-live":"polite" });
  let lastAt = null, seen = new Set();
  const filter = `and(from_page.eq.${mine},to_page.eq.${peer}),and(from_page.eq.${peer},to_page.eq.${mine})`;
  let lastDay = "";
  function addMsg(m){
    if (seen.has(m.id)) return; seen.add(m.id);
    const day = new Date(m.created_at).toLocaleDateString("sv-SE");
    if (day !== lastDay){ lastDay = day; const d = dparts(day); chat.append(el("div", { class:"dmday", text:`${d.y}.${String(d.m).padStart(2, "0")}.${String(d.d).padStart(2, "0")} (${d.w})` })); }
    const minePage = m.from_page === mine;
    chat.append(el("div", { class:"msg" + (minePage ? " mine" : "") }, el("div", { class:"bub", text:m.body }),
      el("div", { class:"meta2", text:(minePage ? (m.profiles?.nickname || "팀원") + " · " : "") + hm(m.created_at) })));
    lastAt = m.created_at;
  }
  async function pull(first){
    let q = sb.from("messages").select("*, profiles(nickname)").or(filter).order("created_at", { ascending:true }).limit(300);
    if (lastAt) q = q.gt("created_at", lastAt);
    const { data, error } = await q;
    if (stale(id) || error) return;
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
    const before = seen.size;
    (data || []).forEach(addMsg);
    if (first && !seen.size) chat.append(el("div", { class:"dmday", id:"dm-empty", text:`${other.name}에게 첫 메시지를 보내 보세요.` }));
    if (seen.size && $("dm-empty")) $("dm-empty").remove();
    if (first || (seen.size > before && atBottom)) chat.scrollTop = chat.scrollHeight;
    if (seen.size > before || first){ await sb.rpc("mark_dm_read", { p_page:mine, p_peer:peer }); const u = await sb.rpc("my_unread_dm"); if (!u.error && typeof u.data === "number"){ S.unread = u.data; renderAcct(); } }
  }

  const ta = el("textarea", { id:"dm-body", maxlength:"2000", placeholder:`${me.name} 이름으로 메시지 보내기`, "aria-label":"메시지" });
  const send = el("button", { type:"submit", class:"btn primary", text:"보내기" });
  const form = el("form", { class:"dmform", onsubmit:async e => {
    e.preventDefault(); const body = ta.value.trim(); if (!body) return;
    send.disabled = true;
    const { error } = await sb.from("messages").insert({ from_page:mine, to_page:peer, sender_id:S.user.id, body });
    send.disabled = false;
    if (error) return toast(errMsg(error), "err");
    ta.value = ""; await pull(false); chat.scrollTop = chat.scrollHeight; ta.focus();
  } }, ta, send);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); } });

  mount(el("div", { class:"narrow", style:"margin-top:24px;display:grid;gap:12px" },
    el("p", { class:"sub", style:"margin:0" }, el("a", { href:"#/dm", style:"color:var(--ink-2)", text:"← DM함" })),
    el("div", { class:"sechead", style:"margin:0" },
      el("div", { style:"display:flex;gap:12px;align-items:center" }, avatar(other.name, other.photo_url), el("div", {}, el("h2", {}, el("a", { href:`#/p/${other.id}`, style:"text-decoration:none", text:other.name })), el("div", { class:"muted", style:"font-size:13px", text:`${KIND[other.kind].label} · ${me.name} 팀으로 대화 중` })))),
    chat, form));
  await pull(true);
  const timer = setInterval(() => { if (stale(id)){ clearInterval(timer); return; } if (!document.hidden) pull(false); }, 6000);
  ta.focus();
}

/* =================== 시작 =================== */
(function boot(){
  if (!window.supabase){ banner("서비스에 연결하지 못했어요. 새로고침해 주세요.", "err"); mount(); return; }
  const hp = new URLSearchParams(location.hash.slice(1)), sp = new URLSearchParams(location.search);
  const fromLink = hp.has("access_token");
  const fromSignup = hp.get("type") === "signup";
  if (hp.get("error_description") || sp.get("error_description")){ banner("링크가 만료됐거나 이미 사용됐어요. 다시 시도해 주세요.", "err"); history.replaceState(null, "", "/#/"); }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ flowType:"implicit", persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(async () => {
      const prev = S.user?.id || null;
      S.user = session?.user || null;
      const changed = (S.user?.id || null) !== prev;
      if (changed || !S.booted) await refreshMe();
      renderAcct();
      if (event === "PASSWORD_RECOVERY"){ S.recovering = true; history.replaceState(null, "", "/#/login"); route(); S.booted = true; return; }
      if (fromLink && event === "SIGNED_IN" && !S.linkHandled){
        S.linkHandled = true;
        if (fromSignup) banner("이메일 인증이 끝났어요. LIVE!에 오신 걸 환영해요!", "ok");
        history.replaceState(null, "", "/#/me"); route(); S.booted = true; return;
      }
      if (!S.booted){
        S.booted = true;
        if (sp.get("next") === "me"){ history.replaceState(null, "", "/#/me"); }
        route(); return;
      }
      if (changed){
        if (S.user && location.hash === "#/login"){ const n = S.next || "#/me"; S.next = null; go(n); }
        else route();
      }
    }, 0);
  });
  window.addEventListener("hashchange", () => { window.onbeforeunload = null; route(); });
  setInterval(async () => {
    if (!S.user || !S.myPages.length || document.hidden) return;
    const u = await sb.rpc("my_unread_dm");
    if (!u.error && typeof u.data === "number" && u.data !== S.unread){ S.unread = u.data; renderAcct(); }
  }, 60000);
})();
</script>
